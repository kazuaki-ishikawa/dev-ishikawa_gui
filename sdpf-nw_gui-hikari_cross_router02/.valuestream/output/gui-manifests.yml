apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  annotations:
    vs.axis-dev.io/stage-type: build
  name: gui-build
spec:
  params:
    - description: 'gui-git-checkout: URL of the GIT repository with https protocol'
      name: gitCloneUrl
    - description: 'gui-git-checkout: Git source revision'
      name: gitRevision
    - default: "true"
      description: 'gui-git-checkout: Clean out of the destination directory if it already exists before cloning (default: true)'
      name: gitRepositoryDeleteExisting
    - default: ""
      description: 'gui-git-checkout: Subdirectory in the source directory to clone Git repository (default: "")'
      name: gitCheckoutSubDirectory
    - description: 'gui-git-checkout: Git token sercret name'
      name: gitTokenSecretName
    - default: Dockerfile
      description: 'gui-kaniko-build-push: The path to the dockerfile to build (relative to the context) (default: Dockerfile)'
      name: pathToDockerFile
    - default: .
      description: 'gui-kaniko-build-push: The path to the build context (default: .)'
      name: pathToContext
    - default: ""
      description: 'gui-kaniko-build-push: The Short name of the image (default: "")'
      name: imageShortName
    - default: latest
      description: 'gui-kaniko-build-push: The tag name of container (default: latest)'
      name: imageTag
    - description: 'gui-kaniko-build-push: The secret name of GCP SA credential'
      name: gcpServiceAccountSecretName
    - description: 'gui-kaniko-build-push: Path of the container registry without image name'
      name: imageRegistryPath
    - default: ""
      description: 'gui-kaniko-build-push: Additional parameters for Kaniko (default: "")'
      name: kanikoOptions
  results:
    - description: Full name of the image with its tag
      name: imageFullNameTag
      value: $(tasks.build.results.imageFullNameTag)
    - description: Full name of the image with its SHA digest
      name: imageFullNameDigest
      value: $(tasks.build.results.imageFullNameDigest)
  tasks:
    - name: checkout
      params:
        - name: gitCloneUrl
          value: $(params.gitCloneUrl)
        - name: gitRevision
          value: $(params.gitRevision)
        - name: gitRepositoryDeleteExisting
          value: $(params.gitRepositoryDeleteExisting)
        - name: gitCheckoutSubDirectory
          value: $(params.gitCheckoutSubDirectory)
        - name: gitTokenSecretName
          value: $(params.gitTokenSecretName)
      taskRef:
        name: gui-git-checkout
      workspaces:
        - name: shared
          workspace: shared
    - name: build
      params:
        - name: pathToDockerFile
          value: $(params.pathToDockerFile)
        - name: pathToContext
          value: $(params.pathToContext)
        - name: imageShortName
          value: $(params.imageShortName)
        - name: imageTag
          value: $(params.imageTag)
        - name: gcpServiceAccountSecretName
          value: $(params.gcpServiceAccountSecretName)
        - name: imageRegistryPath
          value: $(params.imageRegistryPath)
        - name: kanikoOptions
          value: $(params.kanikoOptions)
      runAfter:
        - checkout
      taskRef:
        name: gui-kaniko-build-push
      workspaces:
        - name: shared
          workspace: shared
  workspaces:
    - name: shared
---
