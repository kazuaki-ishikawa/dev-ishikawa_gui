apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: gui-git-checkout
spec:
  params:
    - description: URL of the GIT repository with https protocol
      name: gitCloneUrl
    - description: Git source revision
      name: gitRevision
    - default: "true"
      description: Clean out of the destination directory if it already exists before cloning
      name: gitRepositoryDeleteExisting
    - default: ""
      description: Subdirectory in the source directory to clone Git repository
      name: gitCheckoutSubDirectory
    - description: Git token sercret name
      name: gitTokenSecretName
  results:
    - description: Git commit ID that was checked out by this Task
      name: gitCommitId
    - description: The directory that was cloned repository by this Task
      name: gitCheckoutDirectory
  steps:
    - env:
        - name: GIT_REPO_DELETE_EXISTING
          value: $(params.gitRepositoryDeleteExisting)
        - name: GIT_CHECKOUT_DIR
          value: $(workspaces.shared.path)/source/$(params.gitCheckoutSubDirectory)
      image: asia-northeast1-docker.pkg.dev/solarray-pro-83383605/valuestream-public-image-cache/docker:25.0.5-git
      name: clean-dir
      script: |
        if [ "${GIT_REPO_DELETE_EXISTING}" = "true" ]; then
          if [ -d "${GIT_CHECKOUT_DIR}" ]; then
            # Delete non-hidden files and directories
            rm -rf "${GIT_CHECKOUT_DIR:?}"/*
            # Delete files and directories starting with . but excluding ..
            rm -rf "${GIT_CHECKOUT_DIR}"/.[!.]*
            # Delete files and directories starting with .. plus any other character
            rm -rf "${GIT_CHECKOUT_DIR}"/..?*
          fi
        fi
    - env:
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: $(params.gitTokenSecretName)
        - name: GIT_CHECKOUT_DIR
          value: $(workspaces.shared.path)/source/$(params.gitCheckoutSubDirectory)
      image: asia-northeast1-docker.pkg.dev/solarray-pro-83383605/valuestream-public-image-cache/docker:25.0.5-git
      name: git-clone
      script: |-
        set +x
        GIT_REPOSITORY_URL=`echo $(params.gitCloneUrl) | sed "s/https:\/\///g"`
        GIT_TOKEN=`echo ${GIT_TOKEN} | sed "s/^ //" | sed "s/^　//" | sed "s/ $//" | sed "s/　$//"`
        git clone https://${GIT_TOKEN}:x-oauth-basic@${GIT_REPOSITORY_URL} ${GIT_CHECKOUT_DIR}
        set -x
    - env:
        - name: GIT_CHECKOUT_DIR
          value: $(workspaces.shared.path)/source/$(params.gitCheckoutSubDirectory)
      image: asia-northeast1-docker.pkg.dev/solarray-pro-83383605/valuestream-public-image-cache/docker:25.0.5-git
      name: git-checkout
      script: |
        cd ${GIT_CHECKOUT_DIR}
        git fetch origin $(params.gitRevision)
        git checkout $(params.gitRevision)
        git rev-parse $(params.gitRevision) | tr -d '\n' | tee $(results.gitCommitId.path)
        echo ""
        echo -n ${GIT_CHECKOUT_DIR} | tee $(results.gitCheckoutDirectory.path)
  workspaces:
    - name: shared
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: gui-kaniko-build-push
spec:
  params:
    - default: Dockerfile
      description: The path to the dockerfile to build (relative to the context)
      name: pathToDockerFile
    - default: .
      description: The path to the build context
      name: pathToContext
    - default: ""
      description: The Short name of the image
      name: imageShortName
    - default: latest
      description: The tag name of container
      name: imageTag
    - description: The secret name of GCP SA credential
      name: gcpServiceAccountSecretName
    - description: Path of the container registry without image name
      name: imageRegistryPath
    - default: ""
      description: Additional parameters for Kaniko
      name: kanikoOptions
  results:
    - description: Full name of the image with its tag
      name: imageFullNameTag
    - description: Full name of the image with its SHA digest
      name: imageFullNameDigest
  steps:
    - args:
        - --dockerfile=$(params.pathToDockerFile)
        - --destination=$(params.imageRegistryPath)/$(params.imageShortName):$(params.imageTag)
        - --context=$(params.pathToContext)
        - --image-name-with-digest-file=/tekton/results/imageFullNameDigest
      env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /secret/account.json
      image: asia-northeast1-docker.pkg.dev/solarray-pro-83383605/valuestream-public-image-cache/kaniko-project/executor:v1.24.0-debug
      name: build-and-push
      resources:
        limits:
          cpu: "2"
          memory: 5Gi
        requests:
          cpu: "2"
          memory: 5Gi
      script: |-
        #!/busybox/sh -x
        set -o nounset
        set -o xtrace
        extraparams=$(awk -v arg="$(params.kanikoOptions)" '
          BEGIN {
            n=split(arg, params,  "," )
            for (i=1; i<=n; i++) {
              v = params[i]
              gsub("^ +", "", v); gsub(" +$", "", v);
              prefix = substr(v, 1, 2)
              if (prefix == "--") {
                print(v)
              }
            }
          }'
        )
        /kaniko/executor $@ ${extraparams}
      volumeMounts:
        - mountPath: /secret
          name: user-gcp-secret
      workingDir: $(workspaces.shared.path)/source/
    - image: asia-northeast1-docker.pkg.dev/solarray-pro-83383605/valuestream-public-image-cache/bash:5.3.9
      name: dump-result
      script: |-
        #!/usr/bin/env bash
        echo -n $(params.imageRegistryPath)/$(params.imageShortName):$(params.imageTag) | tee /tekton/results/imageFullNameTag
  volumes:
    - name: user-gcp-secret
      secret:
        items:
          - key: serviceaccount
            path: account.json
        secretName: $(params.gcpServiceAccountSecretName)
  workspaces:
    - name: shared
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: gui-compile-design-pattern
spec:
  params:
    - default: ""
      description: Relative path from source directory
      name: pathToSource
    - description: Path to QVS Config
      name: qvsConfigPath
    - description: Git token sercret name
      name: gitTokenSecretName
    - description: Parameter used in QVS Config
      name: k8sNamespace
    - description: Parameter used in QVS Config
      name: version
    - description: Parameter used in QVS Config
      name: casvalImage
    - description: Parameter used in QVS Config
      name: globalIp
    - description: Parameter used in QVS Config
      name: redisIp
    - description: Parameter used in QVS Config
      name: internalPublicEndpoint
    - description: Parameter used in QVS Config
      name: publicEndpoint
    - description: Parameter used in QVS Config
      name: certName
    - description: Parameter used in QVS Config
      name: securityPolicy
    - description: Parameter used in QVS Config
      name: sslPolicy
    - description: Parameter used in QVS Config
      name: configPath
    - description: Parameter used in QVS Config
      name: internalIp
  results:
    - description: Adapter module
      name: module
    - description: Adapter version
      name: adapterRevision
    - description: List of Adapters used in Assemblyline
      name: adapters
  steps:
    - image: asia-northeast1-docker.pkg.dev/solarray-pro-83383605/valuestream-public-image-cache/linuxserver/yq:3.2.3
      name: display-adapter-info
      onError: continue
      script: |-
        #!/usr/bin/env bash

        # Set Default Pipeline Results
        echo -n "" > /tekton/results/module
        echo -n "" > /tekton/results/adapterRevision
        echo -n "" > /tekton/results/adapters

        # Extract module name
        module=$(yq -r '.modules[0].name' $(params.qvsConfigPath))
        echo "module: $module"
        echo -n $module > /tekton/results/module

        # Extract adapter_revision
        module_revision=$(yq -r '.modules[0].revision' $(params.qvsConfigPath))
        module_local_path=$(yq -r '.modules[0].local.path' $(params.qvsConfigPath))
        module_remote_revision=$(yq -r '.modules[0].remote.revision' $(params.qvsConfigPath))
        			
        if [ "$module_revision" == "null" ]; then
        	case "$module_local_path" in
        		null)
        			# Extract adapter_revision when using remote/repo style module
        			adapter_revision=$module_remote_revision
        			;;
        		*)
        			# Extract adapter_revision when using local module
        			qvsctl_mod_path="$(dirname $(params.qvsConfigPath))/${module_local_path}/qvsctl.mod"
        			if [ -r "$qvsctl_mod_path" ]; then
        				IFS='@' read -ra separated_list < "$qvsctl_mod_path"
        				adapter_revision=${separated_list[1]}
        			fi
        			;;
        	esac
        else
        	# Extract adapter_revision when using remote module
        	adapter_revision=$module_revision
        fi
        echo "adapter_revision: $adapter_revision"
        echo -n $adapter_revision > /tekton/results/adapterRevision

        # Extract design patterns as a comma-separated line
        adapters=$(yq -r '.designPatterns[].pattern' $(params.qvsConfigPath) | tr '
        ' ',' | sed 's/,$//')
        echo "adapters: $adapters"
        echo -n $adapters > /tekton/results/adapters
      workingDir: $(workspaces.shared.path)/source
    - env:
        - name: VS_SECRETS
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pipeline.qmonus.net/secrets']
      image: asia-northeast1-docker.pkg.dev/solarray-pro-83383605/valuestream-public-image-cache/python:3.14.2
      name: make-params-json
      script: |-
        #!/usr/bin/env python3
        import json
        import os
        params = []
        params.append({'name': 'k8sNamespace', 'value': '''$(params.k8sNamespace)'''})
        params.append({'name': 'version', 'value': '''$(params.version)'''})
        params.append({'name': 'casvalImage', 'value': '''$(params.casvalImage)'''})
        params.append({'name': 'globalIp', 'value': '''$(params.globalIp)'''})
        params.append({'name': 'redisIp', 'value': '''$(params.redisIp)'''})
        params.append({'name': 'internalPublicEndpoint', 'value': '''$(params.internalPublicEndpoint)'''})
        params.append({'name': 'publicEndpoint', 'value': '''$(params.publicEndpoint)'''})
        params.append({'name': 'certName', 'value': '''$(params.certName)'''})
        params.append({'name': 'securityPolicy', 'value': '''$(params.securityPolicy)'''})
        params.append({'name': 'sslPolicy', 'value': '''$(params.sslPolicy)'''})
        params.append({'name': 'configPath', 'value': '''$(params.configPath)'''})
        params.append({'name': 'internalIp', 'value': '''$(params.internalIp)'''})
        vs_secrets = os.environ.get('VS_SECRETS')
        secrets = json.loads(vs_secrets) if vs_secrets else []
        print(json.dumps({'params': params, 'secrets': secrets}, indent=4))
        open('$(workspaces.shared.path)/params.json', 'w').write(json.dumps({'params': params, 'secrets': secrets}, indent=4))
      workingDir: $(workspaces.shared.path)/source/$(params.pathToSource)
    - args:
        - manifest
        - compile
        - -o
        - $(workspaces.shared.path)/manifests/manifests-setup.yml
        - -c
        - $(params.qvsConfigPath)
        - -p
        - $(workspaces.shared.path)/params.json
        - --setup
      env:
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: $(params.gitTokenSecretName)
        - name: TMPDIR
          value: /tmpdir
        - name: QVSCTL_SKIP_UPDATE_CHECK
          value: "true"
      image: asia-northeast1-docker.pkg.dev/solarray-pro-83383605/valuestream/qvsctl:v0.19.4
      name: compile-setup
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
        requests:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - mountPath: /tmpdir
          name: tmpdir
      workingDir: $(workspaces.shared.path)/source/$(params.pathToSource)
    - args:
        - manifest
        - compile
        - -o
        - $(workspaces.shared.path)/manifests/manifests-app.yml
        - -c
        - $(params.qvsConfigPath)
        - -p
        - $(workspaces.shared.path)/params.json
      env:
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: $(params.gitTokenSecretName)
        - name: TMPDIR
          value: /tmpdir
        - name: QVSCTL_SKIP_UPDATE_CHECK
          value: "true"
      image: asia-northeast1-docker.pkg.dev/solarray-pro-83383605/valuestream/qvsctl:v0.19.4
      name: compile-app
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
        requests:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - mountPath: /tmpdir
          name: tmpdir
      workingDir: $(workspaces.shared.path)/source/$(params.pathToSource)
    - image: asia-northeast1-docker.pkg.dev/solarray-pro-83383605/valuestream-public-image-cache/bash:5.3.9
      name: check-manifest
      script: |-
        #!/usr/bin/env bash
        if [ -e $(workspaces.shared.path)/manifests/manifests-setup.yml ]; then
          echo '[setup]\n'
          cat $(workspaces.shared.path)/manifests/manifests-setup.yml
        fi
        echo
        if [ -e $(workspaces.shared.path)/manifests/manifests-app.yml ]; then
          echo '[app]\n'
          cat $(workspaces.shared.path)/manifests/manifests-app.yml
        fi
  volumes:
    - emptyDir: {}
      name: tmpdir
  workspaces:
    - name: shared
